name: Build Mamlakat Al-Sahra APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          PROJECT=""

          while IFS= read -r -d '' ZIP; do
            echo "Checking: $ZIP"

            rm -rf /tmp/test
            mkdir /tmp/test

            unzip -q -o "$ZIP" -d /tmp/test || continue

            if find /tmp/test -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              | grep -q .; then

              PROJECT="$ZIP"
              echo "FOUND: $ZIP"
              break
            fi
          done < <(find . -type f -iname "*.zip" -print0)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          unzip -q -o "$PROJECT" -d extracted

          DIR=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not created"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/مملكة_الصحراء.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mamlakat-Al-Sahra-APK
          path: "مملكة_الصحراء.apk"
