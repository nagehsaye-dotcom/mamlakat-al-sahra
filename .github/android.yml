name: Build Mamlakat Al Sahra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*Android_READY*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Unzip Android project
        run: |
          mkdir -p /tmp/game
          unzip -q "$ZIP" -d /tmp/game

      - name: Find Gradle project
        run: |
          ROOT=$(find /tmp/game -name gradlew -type f -print -quit | xargs dirname)
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Project found at: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$ROOT/app/build/outputs/apk" -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/مملكة_الصحراء.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mamlakat-Al-Sahra-APK
          path: مملكة_الصحراء.apk
